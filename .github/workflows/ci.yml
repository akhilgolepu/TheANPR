name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint:
    name: Backend Linting (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint flake8 black
          pip install -r requirements.txt --no-cache-dir
      
      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check code style with black
        run: |
          black --check src/ || true

  backend-tests:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    services:
      sqlite:
        image: sqlite:latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt --no-cache-dir
      
      - name: Run backend unit tests
        run: |
          pytest tests/test_ml_service.py -v --tb=short || true
      
      - name: Run backend integration tests
        run: |
          pytest tests/test_main_integration.py -v --tb=short || true
      
      - name: Run evaluator regression tests
        run: |
          pytest tests/test_plate_detector_requirements.py -v --tb=short || true

  frontend-lint:
    name: Frontend Linting (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run ESLint
        working-directory: frontend
        run: npm run lint || true

  frontend-tests:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Run vitest
        working-directory: frontend
        run: npm run test || true

  frontend-build:
    name: Frontend Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
      
      - name: Verify dist directory
        working-directory: frontend
        run: |
          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory not created"
            exit 1
          fi
          echo "✓ Frontend build successful"

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: anpr:backend-latest
      
      - name: Build frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: anpr:frontend-latest
      
      - name: Test docker-compose.yml syntax
        run: |
          pip install docker-compose
          docker-compose config > /dev/null
          echo "✓ docker-compose.yml is valid"

  security-check:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Run Bandit (Python security linter)
        run: |
          pip install bandit
          bandit -r src/ -f json -o bandit-report.json || true
      
      - name: Check for secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline || true

  code-quality:
    name: Code Quality Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install analysis tools
        run: |
          pip install radon coverage
      
      - name: Calculate Python complexity
        run: |
          radon mi src/ -s || true
      
      - name: Generate coverage report
        run: |
          pip install pytest pytest-cov
          pip install -r requirements.txt --no-cache-dir
          pytest tests/ --cov=src --cov-report=term-missing || true

  summary:
    name: CI Pipeline Summary
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests, frontend-lint, frontend-tests, frontend-build, docker-build]
    if: always()
    
    steps:
      - name: Check job status
        run: |
          echo "Pipeline execution summary:"
          echo "Backend Linting: ${{ needs.backend-lint.result }}"
          echo "Backend Tests: ${{ needs.backend-tests.result }}"
          echo "Frontend Linting: ${{ needs.frontend-lint.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Frontend Build: ${{ needs.frontend-build.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          
          if [ "${{ needs.frontend-build.result }}" = "failure" ]; then
            echo "Frontend build failed - please check logs"
            exit 1
          fi
